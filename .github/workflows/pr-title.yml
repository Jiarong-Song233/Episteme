# The only pull-request check beyond CI: the title becomes the squash subject, so it must be a Conventional Commit.
# Runs on `pull_request`, not `pull_request_target`, and pins the action, so a pull request gets no write token.
name: PR Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  validate:
    name: validate title
    runs-on: ubuntu-latest
    steps:
      # amannn/action-semantic-pull-request v6.1.1 (MIT).
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            perf
            docs
            test
            build
            ci
            chore
            revert
