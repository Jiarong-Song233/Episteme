[package]
name = "episteme-desktop"
version = "0.2.0"
description = "The Episteme learning workbench as a desktop program"
edition = "2021"
rust-version = "1.77.2"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-autostart = "=2.7.0"
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
